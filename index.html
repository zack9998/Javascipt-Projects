<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>
      Frontend Mentor | Newsletter sign-up form with success message
    </title>
  </head>
  <body>
    <div class="container">
      <div>
        <header><h1>Stay updated!</h1></header>
        <article>
          <ul>
            <p>Join 60,000+ product managers receiving monthly updates on:</p>

            <li>
              <img src="./assets/images/icon-list.svg" alt="" />Product
              discovery and building what matters
            </li>
            <li>
              <img src="./assets/images/icon-list.svg" alt="" />Measuring to
              ensure updates are a success
            </li>
            <li>
              <img src="./assets/images/icon-list.svg" alt="" />And much more!
            </li>
          </ul>
        </article>
        <footer>
          <form id="form">
            <div class="label__container">
              <label for="name">Email address</label>

              <span class="error"></span>
            </div>
            <input
              id="email"
              data-name="email"
              name="email"
              placeholder="email@company.com"
            />
            <button id="subscribe" type="submit">
              Subscribe to monthly newsletter
            </button>
          </form>
        </footer>
      </div>
      <div>
        <picture>
          <source
            media="(min-width:769px)"
            srcset="./assets/images/illustration-sign-up-desktop.svg"
          />
          <source
            media="(max-width:768px)"
            srcset="./assets/images/illustration-sign-up-tablet.svg"
          />

          <img
            src="./assets/images/illustration-sign-up-desktop.svg"
            alt="Sign-up Illustration"
          />
        </picture>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
