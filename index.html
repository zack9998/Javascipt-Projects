<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | Age calculator app</title>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <form id="age-form" class="card__form">
          <div class="card__inputContainer">
            <div class="card__input">
              <label for="day">DAY</label
              ><input
                type="text"
                class="input--error input--element"
                id="day"
                name="day"
                placeholder="DD"
                type="number"
                required
                min="1"
              />
              <span></span>
            </div>
            <div class="card__input">
              <label for="month">MONTH</label
              ><input
                type="text"
                class="input--error input--element"
                id="month"
                name="month"
                required
                placeholder="MM"
                type="number"
                min="1"
                max="12"
              />
              <span></span>
            </div>
            <div class="card__input">
              <label for="year">YEAR</label
              ><input
                type="text"
                class="input--error input--element"
                id="year"
                name="year"
                type="number"
                class="card__input"
                placeholder="YYYY"
                min="0"
              />
              <span></span>
            </div>
          </div>
        </form>

        <div class="card--separator">
          <button>
            <img src="./assets/images/icon-arrow.svg" alt="icon-arrow" />
          </button>
        </div>
        <div class="card__result">
          <p><span class="card__resultLabel">--</span> years</p>
          <p><span class="card__resultLabel">--</span> months</p>
          <p><span class="card__resultLabel">--</span> days</p>
        </div>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
